[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hairstyle-recommendation"
version = "0.1.0"
description = "Explainable hairstyle recommendations with optional facial landmarks and schematic 3D previews"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Apache-2.0"}
dependencies = ["streamlit>=1.40,<2", "numpy>=1.26,<3", "pillow>=11,<13", "plotly>=5.24,<7"]

[project.optional-dependencies]
vision = ["mediapipe>=0.10.20,<0.11"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["hairstyle*"]

[tool.setuptools.package-data]
hairstyle = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
